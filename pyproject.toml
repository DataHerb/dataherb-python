[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataherb"
dynamic = ["version"]
description = "Get clean datasets from DataHerb to boost your data science and data analysis projects"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Lei Ma", email = "hi@leima.is" },
]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=0.23",
    "requests>=2.22.0",
    "rapidfuzz>=0.2.2",
    "ruamel.yaml>=0.16.10",
    "click>=7.0",
    "inquirer>=2.6.3",
    "colorama>=0.4.3",
    "GitPython>=3.1.0",
    "loguru>=0.5.3",
    "datapackage>=1.15.2",
    "awscli==1.33.42",
    "docutils>=0.10,<0.16",
    "mkdocs-material==7.1.8",
    "python-slugify==5.0.2",
    "mkdocs-macros-plugin==0.5.12",
    "rich>=10.7.0",
    "validators==0.19.0",
    "yarl==1.9.4",
    "giturlparse==0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.1.2",
]
docs = [
    "mkdocs==1.3.0",
    "mkdocs-autorefs==0.4.1",
    "mkdocs-material==7.1.8",
    "mkdocs-material-extensions>=1.0.3",
    "mkdocstrings==0.18.1",
    "mkdocstrings-python==0.6.6",
    "mkdocstrings-python-legacy==0.2.2",
]

[project.urls]
Homepage = "https://github.com/DataHerb/dataherb-python"

[project.scripts]
dataherb = "dataherb.command:dataherb"

[tool.hatch.version]
path = "dataherb/version.py"

[tool.hatch.build.targets.wheel]
packages = ["dataherb"]

[tool.hatch.build.targets.sdist]
include = [
    "dataherb/**",
    "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
